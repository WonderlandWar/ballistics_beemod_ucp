"Conditions"
	{
	"Condition"
		{
		"Priority" "-100"
		"instance" "<ITEM_TURRET>"
		"Result"
			{
			"SetMarker"
				{
				"name" "tdp_turret"
				"pos"  "0 0 0"
				}
			}
		}

	"Condition"
		{
		"instance"	"<ITEM_TURRET_DROPPER_PLUS>"
		"Condition"
			{
			// If they're all the same, just use a single brush.
			"PosIsSolid"
				{
				"Pos1"   "-48 -48 0"
				"Pos2"   "48 48 0"
				"Dir"    "0 0 1"
				"Type"   "same"
				"SetVar" "$color"
				}
			"Result"
				{
				"TemplateBrush"
					{
					"ID"       "BEE2_CUBE_DROPPER_CLEAN_CAP:single"
					"ColorVar" "$color"
					}
				}
			"Else"
				{
				"TemplateBrush" "BEE2_CUBE_DROPPER_CLEAN_CAP:multi"
				}
			}
		"Result"
			{
			"Has"
				{
				"Deadly"	"1"
				"Turret"	"1"
				}
			"OppositeWallDist"
				{
				"ResultVar"   "$dist"
				"GooCollide"  "1"
				"GooAdjust"   "1"
				"Offset"      "23" // Additional distance to the floor.
				}
			"OppositeWallDist"
				{
				"ResultVar"   "$tdp_scan"
				"Offset"      "64"
				}
			"GetItemConfig"
				{
				"ID"        "TURRET_DROPPER_PLUS"
				"Name"      "COLOR[$timer_delay]"
				"ResultVar" "$turret_color"
				"Default"   "255 255 255"
				}
			"GetItemConfig"
				{
				"ID"        "TURRET_DROPPER_PLUS"
				"Name"      "LOWER_SPEED"
				"ResultVar" "$lower_speed"
				"Default"   "200"
				}
			"GetItemConfig"
				{
				"ID"        "TURRET_DROPPER_PLUS"
				"Name"      "RETURN_SPEED"
				"ResultVar" "$return_speed"
				"Default"   "400"
				}
			"setInstVar" "$tdp_one 1"
			"AddGlobal"
				{
				"File"      "instances/BEE2/logic/tdp_turret_accuracy.vmf"
				"Name"      "tdp_turret_accuracy"
				}
			}
		"Condition"
			{
			"CheckMarker"
				{
				"name"        "tdp_turret"
				"pos"         "-48 -48 0"
				"pos2"        "48 48 $tdp_scan"
				"removeFound" "1"
				"copyto"      "$tdp_one $tdp_claimed"
				}
			}
		"Condition"
			{
			"instVar" "$turret_color != 255 255 255"
			"Result"
				{
				"AddOverlay"
					{
					"File" "instances/BEE2/clean/items/turret_dropper_plus_cowl.vmf"
					"Fixup"
						{
						"$color" "$turret_color"
						}
					}
				}
			}
		"Condition"
			{
			"instvar" "$disable_autodrop 1"
			"Result"
				{
				"GlobalInput"
					{
					"Name"   "@relay_spawn_on_entrance"
					"Target" "script"
					"Input"  "CallScriptFunction"
					"Param"  "spawn"
					}
				}
			}
		}

	"Condition"
		{
		"Priority" "100"
		"instVar"  "$tdp_claimed 1"
		"Result"
			{
			"changeInstance" "instances/BEE2/clean/items/turret_dropper_plus_pose.vmf"
			}
		}
	}
