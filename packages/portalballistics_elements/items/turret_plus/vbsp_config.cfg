"Conditions"
	{
	"Condition"
		{
		"Priority" "-100"
		"instance" "<ITEM_TURRET_PLUS>"
		"Result"
			{
			"SetMarker"
				{
				"name" "tdp_turret"
				"pos"  "0 0 0"
				}
			}
		}

	"Condition"
		{
		"instance" "<ITEM_TURRET_PLUS>"
		"Result"
			{
			"Has"
				{
				"Deadly"	"1"
				"Turret"	"1"
				}
			"GetItemConfig"
				{
				"ID"        "VALVE_HAZARDS"
				"Name"      "SuperTurret"
				"ResultVar" "$super_damage"
				"Default"   "0"
				}
			"GetItemConfig"
				{
				"ID"        "VALVE_HAZARDS"
				"Name"      "ShootThroughPortals"
				"ResultVar" "$shoot_through_portals"
				"Default"   "0"
				}
			// BEE2 2.4.46.1 crashes reading timer widgets when the timer is infinite (0),
			// so infinite turrets skip the lookup and stay untinted.
			"Condition"
				{
				"instVar" "$timer_delay != 0"
				"Result"
					{
					"GetItemConfig"
						{
						"ID"        "TURRET_DROPPER_PLUS"
						"Name"      "COLOR[$timer_delay]"
						"ResultVar" "$turret_color"
						"Default"   "255 255 255"
						}
					}
				"Else"
					{
					"setInstVar" "$turret_color 255 255 255"
					}
				}
			"AddGlobal"
				{
				"File"      "instances/BEE2/logic/tdp_turret_accuracy.vmf"
				"Name"      "tdp_turret_accuracy"
				}
			}
		}
	}
